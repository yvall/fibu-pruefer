[project]
name = "fibu-pruefer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "pdfplumber>=0.11", "pillow", "openpyxl", "pyyaml", "langgraph"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-PyYAML"]

[project.scripts]
fibu = "fibu.cli:main"

[tool.ruff]
line-length = 110
exclude = ["legacy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
mypy_path = ["src"]
strict = true
ignore_missing_imports = true
exclude = ["^legacy/"]

[[tool.mypy.overrides]]
module = ["legacy.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests", "skills"]
