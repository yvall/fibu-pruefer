# store.sqlite_pfad: in config/lokal.yaml setzen (Standard: ~/.fibu/laeufe.db).
# ACHTUNG: Die Datei enthält echte Finanzdaten; Rechte 0600, außerhalb des Repos.

# llm.modell: in config/lokal.yaml setzen oder FIBU_LLM_MODELL als Umgebungsvariable.
# Kein Standardmodell hier – fehlendes Modell führt zu „nicht verfügbar"-Findings, kein Abbruch.

# Schwellenwerte für alle Prüfregeln – werden in ctx.config geladen (Phase 2).
toleranz: 0.02       # Toleranzgrenze aller Rechenweg-Prüfungen in €

# SKR04-Sammelkonten (summen-salden)
debitoren_sammelkonto: "1200"
kreditoren_sammelkonto: "3300"

# Schwellen und Ausnahmen (saldenrichtung)
saldenrichtung_min_saldo: 1.00   # Mindest-Saldo in € für die Richtungsprüfung
saldenrichtung_skip:              # Konten mit typischerweise atypischer Saldenrichtung
  - "2910"
  - "3820"
  - "3830"
  - "4946"
  - "1370"
  - "6850_"

# Schwellen (entwicklung-ausreisser)
personalkosten_ausreisser_schwelle: 10000  # Personalkosten-Abweichung ab der ein Info-Befund entsteht

# Schwellen (durchlaufende-posten)
ueberfaellig_tage: 60   # Alter eines offenen Durchlaufpostens in Tagen bis zum Info-Befund

# SKR04-Konten für UStVA-Abgleich (ustva-abgleich)
ustva_konto_ust_19: "3806"
ustva_konto_vorsteuer: ["1406", "1401"]
ustva_konto_ust_13b: "3837"
ustva_konto_vorsteuer_13b: "1407"
ustva_konto_zahlung: "3820"
ustva_konto_verbindlichkeit: "3860"
