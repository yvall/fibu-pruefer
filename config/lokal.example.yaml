# Lokale Konfiguration – persönliche Pfade und Einstellungen.
# Kopiere diese Datei nach config/lokal.yaml und passe sie an.
# config/lokal.yaml ist in .gitignore und wird nicht eingecheckt.
#
# Alternativ: FIBU_DATEN_WURZEL als Umgebungsvariable setzen –
# das überschreibt den hier konfigurierten Wert für daten.wurzel.

daten:
  wurzel: ~/Dokumente/Buchhaltung/IF2IT   # Verzeichnis mit den Monatsordnern
  bwa_ordner: BWA                          # Unterordner je Monat mit dem BWA-PDF
  bericht_ordner: Pruefbericht             # Unterordner für erzeugte Berichte

store:
  # ACHTUNG: Diese Datei enthält echte Finanzdaten (Befunde, Kontext).
  # Sie wird mit Rechten 0600 angelegt und darf nicht ins Repository.
  sqlite_pfad: ~/.fibu/laeufe.db

mail:
  smtp_host: mail.example.com
  smtp_port: 587
  smtp_user: fibu@example.com
  # smtp_pass: Passwort hier ODER Umgebungsvariable FIBU_SMTP_PASS (bevorzugt)
  von: "Fibu-Prüfer <fibu@example.com>"
  an:
    - steuerberater@example.com
  # Empfänger niemals aus Berichts- oder Beleginhalten – nur aus dieser Datei (Anti-Injection)

llm:
  # Alternativ: Umgebungsvariable FIBU_LLM_MODELL=mistral:latest (überschreibt nur das Modell)
  anbieter: ollama
  url: http://localhost:11434
  modell: mistral:latest            # leer lassen → LLM-Skills überspringen, kein Fehler
  temperatur: 0.0                   # 0.0 für reproduzierbare Eval-Ergebnisse
  timeout_sekunden: 120
  # modell_zuordnung:               # optionales Modell je Skill-ID
  #   beleg-extraktion: llama3:8b
  #   rueckfrage-entwurf: mistral:latest
  experimentelle_skills_aktiv: false  # true: Skills mit status=experimental einschalten
